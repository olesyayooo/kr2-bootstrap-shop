
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заявка — Bootstrap Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Bootstrap Shop</a>

      <button class="navbar-toggler" type="button"
        data-bs-toggle="collapse" data-bs-target="#mainNavbar"
        aria-controls="mainNavbar" aria-expanded="false"
        aria-label="Открыть меню">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
          <li class="nav-item"><a class="nav-link" href="catalog.html">Каталог</a></li>
          <li class="nav-item"><a class="nav-link" href="product.html">Товар</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="order.html">Заявка</a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button"
              data-bs-toggle="dropdown" aria-expanded="false">
              Дополнительно
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="index.html#popular">Популярное</a></li>
              <li><a class="dropdown-item" href="order.html">Оставить заявку</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5 flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">

        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white">
            <h1 class="h4 mb-0">Форма заявки</h1>
          </div>

          <div class="card-body">
            <div class="alert alert-info" role="alert">
              Заполните форму. Поля со звёздочкой обязательны.
            </div>

            <div id="orderResult" class="alert alert-success d-none" role="alert">
              Учебная заявка заполнена. Данные не отправлялись на сервер.
            </div>

            <form id="orderForm">
              <div class="row g-3">

                <div class="col-12 col-md-6">
                  <label class="form-label" for="order-name">Имя *</label>
                  <input class="form-control" id="order-name"
                    name="name" type="text" required>
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label" for="order-email">E-mail *</label>
                  <input class="form-control" id="order-email"
                    name="email" type="email" required>
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label" for="order-phone">Телефон</label>
                  <div class="input-group">
                    <span class="input-group-text">+7</span>
                    <input class="form-control" id="order-phone"
                      name="phone" type="tel" placeholder="900 000-00-00">
                  </div>
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label" for="order-product">Товар</label>
                  <select class="form-select" id="order-product" name="product">
                    <option value="">Выберите товар</option>
                    <option value="iphone16">iPhone 16</option>
                    <option value="ipad-air-m3">iPad Air 11″ M3</option>
                    <option value="macbook-air-m4">MacBook Air 13″ M4</option>
                  </select>
                </div>

                <div class="col-12">
                  <label class="form-label" for="order-comment">Комментарий</label>
                  <textarea class="form-control" id="order-comment"
                    name="comment" rows="4"></textarea>
                </div>

                <div class="col-12">
                  <div class="form-check">
                    <input class="form-check-input" id="order-agree"
                      type="checkbox" required>
                    <label class="form-check-label" for="order-agree">
                      Я согласен на обработку данных *
                    </label>
                  </div>
                </div>

                <div class="col-12 d-flex gap-2">
                  <button class="btn btn-primary" type="submit">
                    Отправить заявку
                  </button>
                  <button class="btn btn-outline-secondary" type="reset">
                    Очистить
                  </button>
                </div>

              </div>
            </form>
          </div>
        </div>

      </div>
    </div>
  </main>

  <footer class="bg-dark text-white py-4 mt-auto">
    <div class="container d-flex flex-wrap justify-content-between gap-2">
      <span>© 2026 Bootstrap Shop. Учебный проект.</span>
      <a href="catalog.html" class="text-white">Каталог</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const selected = new URLSearchParams(window.location.search).get("product");

    if (selected) {
      const productSelect = document.getElementById("order-product");
      const option = Array.from(productSelect.options).find(
        option => option.value === selected
      );

      if (option) {
        productSelect.value = selected;
      }
    }

    const orderForm = document.getElementById("orderForm");

    orderForm.addEventListener("submit", event => {
      event.preventDefault();

      document.getElementById("orderResult").classList.remove("d-none");

      orderForm.reset();
    });
  </script>
</body>
</html>
